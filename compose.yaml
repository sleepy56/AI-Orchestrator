services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orch_metadata
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: ${ORCH_POSTGRES_PASSWORD:-orch_local_only}
    volumes:
      - orch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orch -d orch_metadata"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orch_postgres:
